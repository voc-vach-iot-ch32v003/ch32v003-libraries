; Máy đo dòng tiêu thụ của chip đang test (Arduino Uno R3): 2 trở đo nối tiếp chân GND của chip, tự đổi thang µA / mA.
; Giao tiếp với PC qua Serial 115200, mỗi lệnh 1 dòng (xem đầu src/main.cpp).
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags = -Wall
