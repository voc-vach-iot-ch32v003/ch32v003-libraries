[platformio]
default_envs = smoke_J4M6, smoke_A4M6, smoke_F4P6

[env]
platform = ch32v
framework = ch32v003fun
upload_protocol = minichlink
debug_tool = minichlink
extra_scripts = ch32v003_extra_scripts.py
lib_extra_dirs = ../../
; Thư mục test/ nằm cạnh các thư viện nên phải loại ra (chứa mã ESP32, runner...)
lib_ignore = test
lib_ldf_mode = deep+
build_flags = -Wall -Wextra

[J4M6]
board = genericCH32V003J4M6
build_flags = ${env.build_flags} -DCH32V003_J4M6

[A4M6]
board = genericCH32V003A4M6
build_flags = ${env.build_flags} -DCH32V003_A4M6

[F4P6]
board = genericCH32V003F4P6
build_flags = ${env.build_flags} -DCH32V003_F4P6

[env:smoke_J4M6]
extends = J4M6
build_src_filter = -<*> +<smoke/>
[env:smoke_A4M6]
extends = A4M6
build_src_filter = -<*> +<smoke/>
[env:smoke_F4P6]
extends = F4P6
build_src_filter = -<*> +<smoke/>

; Firmware đỗ: chân Hi-Z, tắt SWD sau 1 giây (chip không được test chạy firmware này)
[env:park_J4M6]
extends = J4M6
build_src_filter = -<*> +<park/>
[env:park_A4M6]
extends = A4M6
build_src_filter = -<*> +<park/>
[env:park_F4P6]
extends = F4P6
build_src_filter = -<*> +<park/>

; Test HIL ch32v003_gpio (kịch bản PC: test/runner/suites/gpio.py)
[env:gpio_J4M6]
extends = J4M6
build_src_filter = -<*> +<gpio/>
[env:gpio_A4M6]
extends = A4M6
build_src_filter = -<*> +<gpio/>
[env:gpio_F4P6]
extends = F4P6
build_src_filter = -<*> +<gpio/>

; Test HIL ch32v003_delay + ch32v003_timer (kịch bản PC: test/runner/suites/timing.py)
[env:timing_J4M6]
extends = J4M6
build_src_filter = -<*> +<timing/>
[env:timing_A4M6]
extends = A4M6
build_src_filter = -<*> +<timing/>
[env:timing_F4P6]
extends = F4P6
build_src_filter = -<*> +<timing/>

; Test HIL ch32v003_intmath (chip tự kiểm tra với bảng sinh từ test/host/gen_intmath_vectors.c)
[env:intmath_J4M6]
extends = J4M6
build_src_filter = -<*> +<intmath/>
[env:intmath_A4M6]
extends = A4M6
build_src_filter = -<*> +<intmath/>
[env:intmath_F4P6]
extends = F4P6
build_src_filter = -<*> +<intmath/>

; Biên dịch thử code Quick Start trong README (test/runner/check_readme.py ghi vào src/_readme/)
[env:readme_J4M6]
extends = J4M6
build_src_filter = -<*> +<_readme/>
[env:readme_A4M6]
extends = A4M6
build_src_filter = -<*> +<_readme/>
[env:readme_F4P6]
extends = F4P6
build_src_filter = -<*> +<_readme/>

; Test HIL dài ch32v003_timer qua mốc tràn SysTick 89.48s (kịch bản PC: test/runner/suites/timer_wrap.py)
[env:timer_wrap_J4M6]
extends = J4M6
build_src_filter = -<*> +<timer_wrap/>
[env:timer_wrap_A4M6]
extends = A4M6
build_src_filter = -<*> +<timer_wrap/>
[env:timer_wrap_F4P6]
extends = F4P6
build_src_filter = -<*> +<timer_wrap/>

; Test HIL ch32v003_i2c: ESP32 làm I2C slave (kịch bản PC: test/runner/suites/i2c.py)
[env:i2c_J4M6]
extends = J4M6
build_src_filter = -<*> +<i2c/>
[env:i2c_A4M6]
extends = A4M6
build_src_filter = -<*> +<i2c/>
[env:i2c_F4P6]
extends = F4P6
build_src_filter = -<*> +<i2c/>

; Test HIL ch32v003_spi: ESP32 làm SPI slave (kịch bản PC: test/runner/suites/spi.py)
[env:spi_J4M6]
extends = J4M6
build_src_filter = -<*> +<spi/>
[env:spi_A4M6]
extends = A4M6
build_src_filter = -<*> +<spi/>
[env:spi_F4P6]
extends = F4P6
build_src_filter = -<*> +<spi/>

; Test HIL ch32v003_power: Sleep / Standby, đánh thức bằng chân + hẹn giờ (kịch bản PC: test/runner/suites/power.py)
[env:power_J4M6]
extends = J4M6
build_src_filter = -<*> +<power/>
[env:power_A4M6]
extends = A4M6
build_src_filter = -<*> +<power/>
[env:power_F4P6]
extends = F4P6
build_src_filter = -<*> +<power/>

; Firmware đo tay dòng Standby (nạp bằng test/runner/standby_hold.py, không phải suite HIL)
[env:standby_hold_J4M6]
extends = J4M6
build_src_filter = -<*> +<standby_hold/>
[env:standby_hold_A4M6]
extends = A4M6
build_src_filter = -<*> +<standby_hold/>
[env:standby_hold_F4P6]
extends = F4P6
build_src_filter = -<*> +<standby_hold/>
[env:sleep_hold_J4M6]
extends = J4M6
build_src_filter = -<*> +<standby_hold/>
build_flags = ${J4M6.build_flags} -DHOLD_MODE=1
[env:sleep_hold_A4M6]
extends = A4M6
build_src_filter = -<*> +<standby_hold/>
build_flags = ${A4M6.build_flags} -DHOLD_MODE=1
[env:sleep_hold_F4P6]
extends = F4P6
build_src_filter = -<*> +<standby_hold/>
build_flags = ${F4P6.build_flags} -DHOLD_MODE=1
[env:swio_probe0_J4M6]
extends = J4M6
build_src_filter = -<*> +<swio_probe/>
build_flags = ${J4M6.build_flags} -DPROBE_PINS=0
[env:swio_probe1_J4M6]
extends = J4M6
build_src_filter = -<*> +<swio_probe/>
build_flags = ${J4M6.build_flags} -DPROBE_PINS=1
[env:swio_probe2_J4M6]
extends = J4M6
build_src_filter = -<*> +<swio_probe/>
build_flags = ${J4M6.build_flags} -DPROBE_PINS=2
[env:swio_probe3_J4M6]
extends = J4M6
build_src_filter = -<*> +<swio_probe/>
build_flags = ${J4M6.build_flags} -DPROBE_PINS=3

; Test HIL dòng tiêu thụ: cần máy đo Uno (test/uno_meter/) ở chân GND của chip (kịch bản PC: test/runner/suites/current.py)
[env:current_J4M6]
extends = J4M6
build_src_filter = -<*> +<current/>
[env:run_hold_J4M6]
extends = J4M6
build_src_filter = -<*> +<standby_hold/>
build_flags = ${J4M6.build_flags} -DHOLD_MODE=2
[env:standby_timer_hold_J4M6]
extends = J4M6
build_src_filter = -<*> +<standby_hold/>
build_flags = ${J4M6.build_flags} -DHOLD_MODE=3
[env:standby_float_hold_J4M6]
extends = J4M6
build_src_filter = -<*> +<standby_hold/>
build_flags = ${J4M6.build_flags} -DHOLD_MODE=4

; Máy đo dòng nhỏ bằng thời gian nạp tụ + OPA làm bộ so sánh (A4M6 trên bàn test, đọc qua minichlink -T)
[env:cap_meter_A4M6]
extends = A4M6
build_src_filter = -<*> +<cap_meter/>
